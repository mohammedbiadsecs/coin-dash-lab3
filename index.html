<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coin Dash — Lab 3 starter</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header><p>LAB 3 · STARTER GAME</p><h1>Coin Dash</h1>
  <p>Collect yellow coins and grab magenta stars for a speed boost. Dodge red drones.</p></header>
  <div class="round-controls">
    <label for="difficulty">Difficulty</label>
    <select id="difficulty">
      <option value="easy">Easy</option>
      <option value="normal" selected>Normal</option>
      <option value="hard">Hard</option>
    </select>
    <button id="start-round" type="button">Start round</button>
  </div>
  <div id="game" aria-label="Coin Dash game. Move with arrow keys or WASD. Pause with P.">
    <p class="game-prompt">Choose a difficulty, then start the round.</p>
  </div>
  <p>Move: <strong>arrow keys / WASD</strong> · Pause: <strong>P</strong> · Restart: <strong>R</strong> · Changing difficulty takes effect next round.</p>
</main>
<script src="vendor/phaser-3.90.0.min.js"></script>
<script src="settings.js"></script><script src="game.js"></script>
</body>
</html>
